services:
  db:
    image: pgvector/pgvector:pg16
    container_name: grad-connect-db
    environment:
      POSTGRES_DB: grad_connect
      POSTGRES_USER: professor
      POSTGRES_PASSWORD: professor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U professor -d grad_connect"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
